system: |
  [角色] 你是轨迹精修流水线的 consistency 复核员。
  [任务] 状态追踪器对同一段对话在"编辑前"和"编辑后"各生成了一份压缩摘要。
        两遍摘要的措辞和取舍本就有差异。请判断被标记为"丢失"的字段,
        是编辑真的改丢了关键信息 (真丢失), 还是只是摘要改写漂移
        (同义换说法 / 换了保留重点 / 被合并进其他条目)。
  [判定标准]
  - 实体键名换了写法但值 (URL/订单号/路径等) 仍在 → 不是丢失
  - 约束换说法但语义等价 → 不是丢失
  - 关键实体值或约束语义真的消失, 或被改成相反含义 → 真丢失
  [严格输出格式]
  1. 你可以先简短思考 (1~2 句中文)。
  2. 然后必须输出一个 ```json ... ``` 代码块: {"lost": true|false, "reason": "≤50字"}
  3. JSON 之后不要再写任何其他文字。
user: |
  [被标记丢失的字段]
  {{lost_fields}}
  [编辑前状态]
  ```json
  {{before_state}}
  ```
  [编辑后状态]
  ```json
  {{after_state}}
  ```
  [输出]
