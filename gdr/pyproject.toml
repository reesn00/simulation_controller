[project]
name = "gdr-agent"
version = "0.1.0"
description = "GDR Agent 数据精修：QwenPaw 会话轨迹自动缺陷检测与精修流水线"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "jsonschema>=4.21",
    "tqdm>=4.66",
    "orjson>=3.9",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "jieba>=0.42",   # 中文实体抽取 (jieba.analyse.extract_tags); 未安装时自动降级
]

[project.optional-dependencies]
sft = ["transformers>=4.40", "peft>=0.10", "trl>=0.8", "datasets>=2.18", "accelerate>=0.27", "torch>=2.1"]
eval = ["scikit-learn>=1.3"]
# Langfuse observability (PR 3): 与根 pyproject.toml 锁定一致; gdr 是 workspace
# 成员, 可独立打包, 此处显式声明便于 gdr 独立安装时也能下载到。
observability = ["langfuse>=3.0,<4.0"]

[project.scripts]
gdr-pipeline = "pipeline:main"
gdr-evaluator = "evaluator.cli:main"

[tool.setuptools.packages.find]
include = ["config*", "core*", "domain*", "infrastructure*", "routing*", "pipeline*", "reassembly*", "refiners*", "validators*", "evaluator*", "data*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
