# etl.qwenformat 阶段配置
#
# tool_output_summarizer: 工具返回内容精简 (L0 规则预清洗 + L1 LLM 锚点摘要)。
# 由 orchestration/workers/qf_worker.py 构造 LLMAnchoredSummarizer 时读取;
# 每项均可被同名 QF_SUMMARIZER_* 环境变量覆盖 (env 优先于本文件)。
#
# 注意: api_key 为敏感凭据, 建议本地填写后不要提交; 也可留空, 用
# QF_SUMMARIZER_API_KEY 环境变量注入。

tool_output_summarizer:
  # 总开关; 默认关闭 (验证达标后再开)。env: QF_SUMMARIZER_ENABLED=1
  enabled: false

  # OpenAI 兼容端点; 建议用小 instruct 模型做一次性离线摘要。
  # env: QF_SUMMARIZER_BASE_URL / QF_SUMMARIZER_MODEL / QF_SUMMARIZER_API_KEY
  base_url: "http:///v1"
  model: "MiniMax-M2.7"
  api_key: "bgw_Y_-cBJcZtPzcnhq6BkE8wYX4bqjmZ8edyPHi5BSxSTM"

  # L0 清洗后短于该字符数的工具输出跳过 LLM, 原样保留。
  # env: QF_SUMMARIZER_THRESHOLD_CHARS
  threshold_chars: 800

  # 质量门: kept_facts 在原始返回中的命中率下限, 低于则保留完整内容。
  faith_threshold: 0.7

  # LLM 摘要缓存目录 (sha256(raw+锚点).json), 命中即跳过调用。
  # 相对路径基于仓库根目录; 该目录已被 .gitignore 忽略。
  cache_dir: "etl/qwenformat/cache/tool_summaries"
