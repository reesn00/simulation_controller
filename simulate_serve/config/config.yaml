model:
  model_type: OPENAI        # OPENAI | ANTHROPIC
  model_name: Qwen3.5-9B-UD-Q6_K_XL
  api_key: "local——YOUR_API_KEY"
  base_url: "http://0.0.0.0:9090"
  temperature: 0.7

agent_endpoint:
  base_url: "http://localhost:8088"   # QwenPaw 后端地址（含端口，不含 /api）
  execution_agent_id: ""               # 执行阶段 agent ID（X-Agent-Id），留空使用默认 agent
  validation_agent_id: ""              # 验证阶段 agent ID（X-Agent-Id），留空使用默认 agent
  auth_token: ""                       # Bearer token，未启用鉴权时留空
  user_id: "useramulation"
  timeout: 30.0                        # 单次 HTTP 请求超时（秒）
  task_timeout: 900.0                 # 服务端任务看门狗超时（秒，15 分钟）覆盖搜索/抓取类长任务
  poll_interval: 3.0                   # 轮询间隔（秒）
  max_poll_time: 960.0                # 最长等待任务完成（秒，task_timeout + 60s 缓冲）
  max_retries: 2                       # 提交任务重试次数

max_guide_rounds: 3
output_dir: output
tasks_file: tasks.yaml
scenarios_file: scenarios.yaml

validation:
  semantic_judge_enabled: true
  judge_timeout_seconds: 60

tools:
  startup_policy: warn
  providers:
    - name: playwright
      type: playwright_mcp
      enabled: false
      required: false
      priority: 100
      capabilities:
        - browser.navigate
        - browser.snapshot
        - browser.inspect_links
        - browser.inspect_media
        - browser.detect_barrier
    - name: camoufox
      type: camoufox
      enabled: false
      required: false
      priority: 50
      capabilities:
        - browser.navigate
        - browser.snapshot
        - browser.inspect_links
        - browser.inspect_media
        - browser.detect_barrier
    - name: browser_use
      type: browser_use
      enabled: true
      required: false
      priority: 75
      capabilities:
        - browser.navigate
        - browser.snapshot
        - browser.inspect_links
        - browser.inspect_media
        - browser.detect_barrier
      # 可选依赖: pip install -e .[browser_use]  (要求 Python >= 3.11)
      # 未安装或 LLM 不可达时自动标记不可用，不影响系统启动
      # config 段为可选覆盖项，缺省时继承全局 model 配置与 OPENAI_* 环境变量:
      # config:
      #   llm_model: ""        # 缺省继承 model.model_name
      #   llm_api_key: ""      # 缺省继承 model.api_key，其次 OPENAI_API_KEY
      #   llm_base_url: ""     # 缺省继承 model.base_url，其次 OPENAI_BASE_URL
      #   headless: true
      #   viewport_width: 1280
      #   viewport_height: 720
      #   allowed_actions:
      #     - navigate
      #     - extract_content
      #     - screenshot
