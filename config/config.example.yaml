# ============================================================
# 统一配置入口模板 (提交版; 复制为 config/config.yaml 后填写真实值)
#
# 全项目唯一的配置文件: simulate_serve / orchestration / gdr /
# etl.qwenformat 四个模块的配置全部收纳于此 (模块级配置文件已删除)。
#
# 加载优先级 (各模块统一): CLI 参数 > 环境变量 (GDR_* / QF_SUMMARIZER_* 等)
#                       > config/config.yaml 对应 section > 代码默认值
#
# llm: 为共享段, simulate_serve.model / gdr.*_model / qf.tool_output_summarizer
# 未显式指定时自动继承其 base_url/api_key/model。
# ============================================================

llm:
  base_url: "http://localhost:8000/v1"   # 占位: 替换为真实 LLM 网关
  api_key: "${LLM_API_KEY}"     # 支持环境变量占位符, 避免明文凭据落盘
  model: "your-model-name"

# === Langfuse observability (simulate_serve / gdr / etl 三阶段共享) ===
# 默认 enabled=false, 旧批次零侵入; 生产环境另在 config/config.yaml 覆盖。
# 凭据经 ${LANGFUSE_*} 环境变量注入, 不在仓库内出现明文。
# upload_payload: full | summary | none — full 默认, 用于"对比观察原始 vs 精修 vs 整理";
#                   summary 仅传 metadata + 体积; none 完全关闭 payload。
langfuse:
  enabled: false
  public_key: "${LANGFUSE_PUBLIC_KEY}"
  secret_key: "${LANGFUSE_SECRET_KEY}"
  base_url: "https://cloud.langfuse.com"
  environment: "dev"
  release: "${LANGFUSE_RELEASE:-local}"
  sample_rate: 1.0
  flush_at: 512
  flush_interval: 5.0
  timeout: 10
  upload_payload: full
  max_payload_bytes: 0
  stages:                          # 阶段级开关; 各阶段可独立关停
    simulate_serve:
      enabled: true                # 当根 enabled=true 时, simulate_serve 是否上传
    gdr:
      enabled: true
      per_step_span: true          # 21 步骤逐个起 step_span
      per_llm_span: false          # LlamaCppClient.chat 级 generation span
    etl:
      enabled: true
      per_step_span: true          # etl.load_refined_session / etl.save_c3_4views

# === simulate_serve (用户模拟服务) ===
# model 段未写的 model_name/api_key/base_url 继承 llm 段;
# tasks_file/scenarios_file 未写时自动锚定 simulate_serve/config/ 包内目录。
simulate_serve:
  model:
    model_type: OPENAI        # OPENAI | ANTHROPIC
    temperature: 0.7
  agent_endpoint:
    base_url: "http://localhost:8088"   # QwenPaw 后端地址（含端口，不含 /api）
    execution_agent_id: ""               # 执行阶段 agent ID（X-Agent-Id），留空使用默认 agent
    validation_agent_id: ""              # 验证阶段 agent ID（X-Agent-Id），留空使用默认 agent
    auth_token: ""                       # Bearer token，未启用鉴权时留空
    user_id: "useramulation"
    timeout: 30.0                        # 单次 HTTP 请求超时（秒）
    task_timeout: 1800.0                # 服务端任务看门狗超时（秒）
    poll_interval: 3.0                   # 轮询间隔（秒）
    max_poll_time: 1860.0               # 最长等待任务完成（秒）
    max_retries: 2                       # 提交任务重试次数
  max_guide_rounds: 3
  skip_unready_tasks: true
  output_dir: output
  validation:
    enabled: false              # false = record-only 模式
    semantic_judge_enabled: true
    judge_timeout_seconds: 60
  interaction:
    actor_timeout_seconds: 180
  tools:
    startup_policy: warn
    providers: []
    #   - name: browser_use
    #     type: browser_use
    #     enabled: true
    #     required: false
    #     priority: 75
    #     capabilities: [browser.navigate, browser.snapshot]

# === orchestration (编排) ===
# 新架构 simulation server → gdr → etl: qf 阶段已删除。
# 字段语义详见 docs/设计方案/pipeline-contracts.md §1。
orchestration:
  pipeline:
    max_parallelism: 1        # 同时跑 task 的子进程槽位数 (≥1)
    max_retry_gdr: 3          # gdr 阶段最大重试次数 (≥0)
    max_retry_etl: 3          # etl 阶段最大重试次数 (≥0)
    retry_poll_seconds: 2.0   # 重试循环之间的休眠秒数 (>0)

paths:
  trajectory_dir: "output/agent_trajectory"   # simulate_serve 写 C1 trajectory
  runs_dir: "output/runs"                     # JsonRunRepository 的 runs 根目录
  refined_dir: "output/refined"               # gdr 末端写 C2 refined Session 单文件
  etl_outputs_dir: "output/refine_data"       # etl 末端写 4 视图 (C3 契约)
  sqlite_db: "output/orchestration/orchestration.db"
  dead_dir: "output/orchestration/dead"
  pid_file: "output/orchestration/orchestration.pid"
  log_dir: "output/orchestration/logs"

# === gdr (数据精修) — 全量配置 ===
# 字段与 gdr/config/settings.py 的 Settings 字段一一对应;
# llm_base_url/llm_api_key/main_model/tool_model/judge_model 未写时继承 llm 段。
# 环境变量 (GDR_*) 可逐项临时覆盖。以下为默认调优值, 按需调整。
gdr:
  embedding_endpoint_url: "http://127.0.0.1:8086/v1"
  embedding_endpoint_model: "v5-small-retrieval-Q6"
  embedding_expected_dim: 1024
  embedding_timeout_s: 30.0
  embedding_max_batch: 32

  n_ctx: 8192
  n_gpu_layers: -1

  enable_l1: true
  enable_l2: true
  enable_l3: true
  enable_llm_layer: true
  enable_text_fact_check: true

  llm_vote_context_strategies: ["none", "±1", "pre2_post1"]
  llm_vote_max_context_chars: 4000
  llm_vote_use_cu: true
  llm_vote_skip_rule_decidable: true
  cu_prompt_max_chars: 4000
  cu_prompt_archive_strategy: referenced
  fold_use_cu: true
  fold_protect_active_text_only: true

  max_retries_9b: 2

  tools_config_path: ./config/tools.yaml
  tool_source: auto
  qwenpaw_agent_json: ~/.qwenpaw/workspaces/default/agent.json
  input_path: ../output/agent_trajectory
  output_path: refine_data/output.json
  log_dir: ./logs

  llm_timeout_s: 120
  l3_timeout_s: 60

  max_compression_ratio: 1.50
  thought_min_len: 20
  thought_max_len: 500
  thought_max_len_l1: 2000
  thought_max_len_grace_pct: 10
  context_switch_threshold: 3
  repetitive_call_threshold: 3
  message_health_min_ratio: 0.3
  max_failures_before_success: 8

  context_active_window_size: 4
  context_relevance_threshold: 0.6
  context_redundancy_threshold: 0.85
  enable_context_understanding: true

  context_max_archive_chars: 80000
  context_max_t0_entries: 200
  context_compression_strategy: hybrid
  context_max_llm_compressions: 3

  context_tier0_threshold: 0.7
  context_tier1_threshold: 0.5
  context_tier2_threshold: 0.3
  context_tier3_threshold: 0.1

  context_importance_w_error: 0.30
  context_importance_w_transit: 0.25
  context_importance_w_refs: 0.20
  context_importance_w_finality: 0.15
  context_importance_w_novelty: 0.10

  enable_policy_layer: true
  policy_defer_on_exhausted: true
  policy_prune_with_pair_enabled: false
  policy_min_redundancy_for_prune: 1

  batch_input_dir: null
  batch_output_dir: null
  workers: 2
  llm_concurrency: 4
  max_files: null
  session_timeout_s: 1200

  strict_consistency: true
  judge_min_score: 7
  judge_low_export_enabled: true
  judge_low_output_path: ./refine_data/judge_low.jsonl
  routing_abstain_audit_enabled: true
  routing_abstain_audit_path: ./refine_data/routing_low.jsonl

  evaluator_output_dir: ./evaluator_output
  probe_base_model_name: "Qwen/Qwen3.5-9B-Instruct"
  probe_train_data_dir: ./data/sft_pairs
  probe_lora_r: 16
  probe_lora_alpha: 32
  probe_epochs: 3
  probe_batch_size: 4
  probe_learning_rate: 0.0002
  eval_set_path: ./data/eval_set.jsonl
  eval_held_out_size: 200
  retention_threshold: 0.97
  removal_threshold: 0.50
  max_feedback_iterations: 3

  # === Langfuse 可观测性 (gdr PR 3, 扁平字段) ===
  # 与 ``langfuse.stages.gdr`` 段等价; 前者覆盖后者 (运行时前者字段直接生效)。
  # ``langfuse_*`` 通用字段 (enabled / public_key / secret_key / base_url / ...)
  # 由 simulate_serve.observability.langfuse_client 工厂鸭子类型解析, 这里只
  # 暴露 gdr 阶段专用开关。``stages.gdr`` 嵌套配置更便于和其他阶段共用同一份
  # ``langfuse:`` 凭据段; 扁平字段更便于 env_prefix=GDR_ 临时覆盖。
  langfuse_enabled: false                # stages.gdr.enabled 同义; 默认关闭
  langfuse_gdr_per_step_span: true       # 21 步骤逐个起 step_span
  langfuse_gdr_per_llm_span: false       # LlamaCppClient.chat 级 generation span (100+ spans/session)
  langfuse_gdr_per_refine_span: false    # 每条 repair_item 一个 span (高级)
  langfuse_upload_payload: full          # full | summary | none
  langfuse_max_payload_bytes: 0          # session payload 截断阈值 (0 = 不截断)
  langfuse_max_block_payload_bytes: 0    # 单 block payload 截断阈值 (0 = 不截断)

  # === 两层评分系统 (方案 trajectory-scoring-two-layer.md) ===
  # 第一层: 对比式评分 (Reference-based, 原始轨迹 vs 修改后轨迹)
  enable_trajectory_compare: true
  compare_fidelity_llm: true              # fidelity 三要素抽取用 LLM
  compare_diff_classifier: "rule_first"   # rule_first / llm_only / hybrid
  compare_coherence_reuse_reassembly: true
  compare_max_retries: 2                  # 对比式 fail 回精修的最大重试轮数

  # 第二层: 独立式评分 (Reference-free, 只看修改后轨迹)
  enable_free_quality: true
  enable_redline: true
  redline_piracy_url_patterns: []         # 侵权站点 URL 正则黑名单
  redline_privacy_patterns: []            # 隐私正则 (账号/Cookie/手机号/邮箱)
  redline_prompt_injection_patterns: []   # 注入性语句
  redline_tos_violation_selectors: []     # ToS 违规 DOM selector 模式
  redline_llm_review_suspicious: true     # 可疑项 LLM 复核
  absolute_quality_min_score: 4           # 放行阈值 ≥4/5
  absolute_quality_min_subscore_executability: 4
  absolute_quality_min_subscore_action_obs: 4
  absolute_quality_score_mapping: "linear_tier"

  # 金标集 / 漂移监控
  golden_set_enabled: false
  golden_set_path: ./data/golden_trajectories
  golden_set_anchor_count: 50
  golden_set_drift_threshold: 0.3
  golden_set_drift_action: "alert"
  golden_set_probe_pairs_per_batch: 20

  # === Usage Prune 前移到 gdr (方案 etl-prune-frontload.md) ===
  # gdr 末尾 step 22: 按真实调用裁剪 system/tools + 本机路径泛化 (CLAUDE.md 隐私红线).
  # 关闭后回退到 etl 阶段裁剪 (仅存量重跑兼容).
  usage_prune_enabled: true
  # 独立式评分 reject 旁路 (C2 不落盘, 转 audit/scoring_reject.jsonl).
  scoring_reject_audit_enabled: true
  scoring_reject_output_path: ./audit/scoring_reject.jsonl

# === qf (etl.qwenformat 工具输出摘要) ===
# base_url/model/api_key 未写时继承 llm 段; 各项可被 QF_SUMMARIZER_* env 覆盖。
qf:
  tool_output_summarizer:
    enabled: false
    threshold_chars: 800
    faith_threshold: 0.7
    cache_dir: "etl/qwenformat/cache/tool_summaries"
