[project]
name = "useramulation"
version = "0.2.0"
description = "Agent 轨迹合成管线（trajectory_pipeline）：代码执行循环 + 可替换感知层，采集可归因的训练轨迹"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "useramulation" },
]

dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.28",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    # ── 执行层（D11：camoufox 取代 obscura 成为目标执行层）───────────
    # **钉死版本**，不用范围：指纹由 fpgen 生成，版本一动指纹就动，
    # 而批次分布的可归因性建立在「指纹只随配置变、不随升级变」上。
    # 实测面见 docs/设计方案/04-camoufox执行层替换方案.md §4.3.1。
    #
    # ⚠️ 不是 [project.optional-dependencies].legacy 里的
    # ``cloverlabs-camoufox``——那是 v1 归档树的第三方 fork，**包名不同、
    # API 面可能不同**（CLAUDE.md 纪律 2：存量只读参考）。两者不许混用。
    "camoufox==0.5.8",
    # playwright 是 camoufox 的传递依赖，但 `executor/browser/camoufox_driver.py`
    # **直接** import 它的异常类型（`playwright.async_api.Error`）——直接
    # 依赖必须直接声明，否则上游哪天换实现，报错会出现在 import 期而不是测试里。
    "playwright==1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trajectory_pipeline"]
exclude = [
    "**/__pycache__/**",
]

[dependency-groups]
dev = [
    "build>=1.2",
    "hatchling>=1.25",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-socket>=0.7",
    # ⚠️ **当前没有任何代码 import 它**——2026-10-21 起那两份人工复核工作单
    # （23/254 条 xlsx）已被删除，读它们的两组测试同步清退了 11 条
    # （见 docs/计划进展/09-门禁与纪律域.md §xlsx 测试清退）。
    # 保留在 dev 组只为下一轮人工复核导出新工作单时直接用（31 条
    # flagged_mismatch 仍待人工）。生产代码从不用它，故不进主依赖。
    # ⚠️ 它此前一直是「本机手装、未声明」的状态——2026-10-20 声明 camoufox 后
    # 跑 `uv sync` 被当作多余包卸掉，两个测试文件直接 collection error。
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# v1 归档代码（archive/v1/）手动运行所需；主环境默认不装（uv sync --extra legacy）。
legacy = [
    "camel-ai>=0.2.0",
    "jinja2>=3.0",
    "cloverlabs-camoufox==0.6.0",
]

[tool.pytest.ini_options]
# v1（simulate_serve / orchestration / gdr / etl / label_studio / tool_runtime /
# data_refiner）已于 2026-10-09 归档至 archive/v1/，其测试随之退役出默认门禁——
# 门禁保护「会被修改的代码」，冻结树无从回归。手动跑法见 archive/v1/README.md。
# 历史教训（为什么 gate 必须显式枚举每一棵**在开发**的树）：gdr/tests 曾长期
# 不在 testpaths 里，360+ 用例不跑，掩盖了 3 处 ImportError、2 处过期 fixture、
# 2 处生产代码静默失效（双导入 → isinstance 恒 False，usage_prune 从未执行）。
testpaths = ["trajectory_pipeline/tests"]
addopts = "-ra --strict-markers --allow-hosts=127.0.0.1,::1 --basetemp=.pytest-tmp"
asyncio_mode = "auto"
markers = [
    "characterization: legacy behavior characterization",
    "contract: boundary contract tests",
    "functional: offline end-to-end functional tests",
    "known_gap: accepted defect pending its planned phase",
    "package: package build and installation tests",
    "browser_smoke: optional local browser smoke tests",
    "integration: requires a live external service (e.g. local Label Studio on 127.0.0.1:8088); not run on default CI",
]

# [tool.uv.workspace] 刻意不存在：trajectory_pipeline 以主包管理（hatch packages）。
# 任何 workspace 成员身份都会制造第二套导入姿势——gdr 曾身为成员，同源码被
# 加载成两套类对象，跨边界 isinstance 静默判 False，usage_prune 从未真正执行
# （详见 CLAUDE.md 开发纪律与 00-总体方案 §0）。
